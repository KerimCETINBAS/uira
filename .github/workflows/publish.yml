name: Publish to npm

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const tag = process.env.RELEASE_TAG.replace(/^v/, ""); const version = require("./package.json").version; if (tag !== version) throw new Error(`Tag ${tag} must match package version ${version}`);'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
